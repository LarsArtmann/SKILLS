<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>HyperFrames ground truth — 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #0b0f14;
        color: #f5f7fa;
        font-family: Inter, system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .card {
        display: grid;
        gap: 28px;
        justify-items: center;
        text-align: center;
        padding: 0 64px;
      }
      .kicker {
        margin: 0;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-size: 22px;
        color: #7c8794;
      }
      h1 {
        margin: 0;
        font-size: 76px;
      }
      .sub {
        margin: 0;
        font-size: 32px;
        color: #a8b3bf;
      }
      .bar {
        width: 240px;
        height: 8px;
        background: #e8b31a;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="gt-9x16"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5"
    >
      <section id="card-a" class="clip" data-start="0" data-duration="2.5">
        <div class="card">
          <p class="kicker">Ground truth fixture</p>
          <h1 id="card-a-title">9:16 social cut</h1>
          <p class="sub">same beats, vertical canvas</p>
        </div>
      </section>
      <section id="card-b" class="clip" data-start="2.5" data-duration="2.5">
        <div class="card">
          <div class="bar" id="card-b-bar"></div>
          <h1 id="card-b-title">Seek-safe by construction</h1>
          <p class="sub">stacked layers, fromTo tweens only</p>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from(
        "#card-a .kicker",
        { autoAlpha: 0, y: 24, duration: 0.5, ease: "power2.out" },
        0.1,
      )
        .from(
          "#card-a-title",
          { autoAlpha: 0, y: 48, duration: 0.7, ease: "power3.out" },
          0.25,
        )
        .from(
          "#card-a .sub",
          { autoAlpha: 0, y: 24, duration: 0.5, ease: "power2.out" },
          0.55,
        )
        .fromTo(
          "#card-b-bar",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.6, ease: "power2.inOut" },
          2.7,
        )
        .from(
          "#card-b-title",
          { autoAlpha: 0, y: 48, duration: 0.7, ease: "power3.out" },
          2.75,
        )
        .from(
          "#card-b .sub",
          { autoAlpha: 0, y: 24, duration: 0.5, ease: "power2.out" },
          3.05,
        );
      window.__timelines["gt-9x16"] = tl;
    </script>
  </body>
</html>
