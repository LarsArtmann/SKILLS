# Docs-only content repo (AGENTS.md §1): the product is markdown skills plus
# self-contained scripts. There is deliberately no Go build system (§9) — the
# Go files here are single-file skill tools (`go run <file>.go`) and
# intentionally non-compiling reference snippets, not packages. Repo-level
# Go-project rules (mandatory go.mod / .golangci.yml / internal/ layout)
# therefore do not apply. Recorded deliberate non-fix per buildflow skill
# step 7; per-file Go quality is verified per convention (go vet + gofmt +
# --self-test).
# dprint-format (skipped 2026-11-15): the full-pipeline executor stages a
# copy of the repo WITHOUT repo config files (BuildFlow format_roundtrip.go),
# so its dprint step runs on a generated exclude-less config and REWRITES
# frozen point-in-time evidence — compiled eval output artifacts under
# **/outputs/** and *-workspace/ (observed 3x on 2026-11-15; one corruption
# was auto-committed and restored in 5e585c4). It also crashes on tables
# nested in list items in archived status reports. Formatting stays manual
# per AGENTS §1: `dprint fmt <files>` with the repo dprint.json, whose
# excludes encode the frozen/live boundary.
skip_steps:
  - go-structure-linter
  - dprint-format
