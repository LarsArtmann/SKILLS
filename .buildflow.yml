# Docs-only content repo (AGENTS.md §1): the product is markdown skills plus
# self-contained scripts. There is deliberately no Go build system (§9) — the
# Go files here are single-file skill tools (`go run <file>.go`) and
# intentionally non-compiling reference snippets, not packages. Repo-level
# Go-project rules (mandatory go.mod / .golangci.yml / internal/ layout)
# therefore do not apply. Recorded deliberate non-fix per buildflow skill
# step 7; per-file Go quality is verified per convention (go vet + gofmt +
# --self-test).
# dprint-format (skipped 2026-11-15): the full-pipeline executor stages a
# copy of the repo WITHOUT repo config files (BuildFlow format_roundtrip.go),
# so its dprint step runs on a generated exclude-less config and REWRITES
# frozen point-in-time evidence — compiled eval output artifacts under
# **/outputs/** and *-workspace/ (observed 3x on 2026-11-15; one corruption
# was auto-committed and restored in 5e585c4). It also crashes on tables
# nested in list items in archived status reports. Formatting stays manual
# per AGENTS §1: `dprint fmt <files>` with the repo dprint.json, whose
# excludes encode the frozen/live boundary.
# tailwind-build (skipped 2026-11-22, round 5 — root cause of the "dprint"
# corruption class): this step REBUILDS css files with tailwindcss v4.3.3,
# and the design-to-code eval outputs ARE tailwind build artifacts — the
# step regenerates frozen evidence with a different tailwind version,
# SEMANTICALLY changing it (round 5: .resize utility dropped, 4 files,
# caught live with the triggering invocation logged; the daemon committed
# the corruption as 3123c19 within 40s and it was restored in a917805).
# Round 4 (2026-11-15, "no formatter in window") is most plausibly this
# same step in a non-fix run — misattributed to dprint because dprint was
# the known corruptor.
# prettier-format (skipped 2026-11-22, same class as dprint by mechanism):
# detect mode only warns today, but `buildflow --fix` runs prettier --write,
# which has NO exclude mechanism in the staged copy (same missing-config
# root cause as dprint) and flags the same frozen css files. Formatting
# doctrine for this repo is manual dprint (above); prettier adds a live
# corruption vector under --fix without adding coverage dprint lacks.
skip_steps:
  - go-structure-linter
  - dprint-format
  - tailwind-build
  - prettier-format
